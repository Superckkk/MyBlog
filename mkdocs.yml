# =============================================================================
#  MkDocs 配置 —— 技术笔记站
#
#  本地预览： .venv\Scripts\python.exe -m mkdocs serve
#  构建产物： .venv\Scripts\python.exe -m mkdocs build
#
#  改完本文件后如果预览没有热更新，手动重启一下 serve 即可。
# =============================================================================

site_name: 我的技术博客
site_url: https://turingckkk.com/
site_description: 学习笔记与技术备忘
site_author: ckkk
copyright: Copyright &copy; 2026 ckkk

# 右上角的仓库链接和「编辑此页」按钮都靠这两个
repo_url: https://github.com/Superckkk/MyBlog
repo_name: Superckkk/MyBlog
edit_uri: edit/main/docs/


# -----------------------------------------------------------------------------
# 主题
# -----------------------------------------------------------------------------
theme:
  name: material
  language: zh

  # 关键：关掉主题自带的 Google Fonts 请求，
  # 字体改用自托管的霞鹜文楷，CSS 变量在 docs/stylesheets/extra.css 里定义。
  font: false

  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg

  icon:
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

  features:
    - navigation.instant            # 单页应用式跳转
    - navigation.instant.progress   # 顶部加载进度条
    - navigation.tracking           # 地址栏跟随滚动更新锚点
    - navigation.tabs               # 一级导航做成顶栏
    - navigation.tabs.sticky        # 顶栏吸顶
    - navigation.sections           # 侧栏分组展开
    - navigation.indexes            # index.md 作为分组的落地页
    - navigation.top                # 回到顶部
    - navigation.footer             # 上一页 / 下一页
    - navigation.path               # 面包屑
    - toc.follow                    # 右侧目录跟随滚动
    - search.suggest                # 搜索联想
    - search.highlight              # 搜索结果高亮
    - search.share                  # 搜索结果分享链接
    - content.code.copy             # 代码块复制按钮
    - content.code.select           # 代码块按行选中
    - content.code.annotate         # 代码块行内标注
    - content.tabs.link             # 跨页同步内容标签页
    - content.tooltips             # 链接与脚注悬浮预览
    - content.action.edit           # 编辑此页
    - content.action.view           # 查看源码


# -----------------------------------------------------------------------------
# 导航
#
# AI / Coding / ComputerScience / Tools 是顶层 section，配合 navigation.tabs
# 直接变成顶栏的那几个 tab；每个 section 的第一项是它自己的 index.md，
# 靠 navigation.indexes 当落地页（点 tab 就进这一页）。
#
# 目录结构也和 typst/ 下的源目录一一对应，以后同步新笔记照着放就行。
# -----------------------------------------------------------------------------
nav:
  - 首页: index.md
  - AI:
      - AI/index.md
      - 深度学习:
          - AI/DeepLearning/index.md
          - 数据操作: AI/DeepLearning/数据操作.md
  - Coding:
      - Coding/index.md
      - Python:
          - Coding/python/index.md
  - ComputerScience:
      - ComputerScience/index.md
      - 理论计算机科学: ComputerScience/TCS/index.md
  - Tools:
      - Tools/index.md
      - Typst 的好用包: Tools/Typst.md
      - 其它在线工具: Tools/Else.md
  - 标签: tags.md
  - 关于: about.md


# -----------------------------------------------------------------------------
# 插件
# -----------------------------------------------------------------------------
plugins:
  # 站内搜索。中文分词依赖 jieba（见 requirements.txt），否则搜中文基本没法用。
  - search:
      lang:
        - zh
        - en
      separator: '[\s\u200b\-]'

  # 标签索引。内容由 docs/tags.md 里的 <!-- material/tags --> 指令注入。
  # 注意：不要再配 tags_file，Material 9.7 起这个选项已废弃。
  - tags:
      listings: true
      listings_toc: true

  # 压缩产物。
  # 注意：css_files / js_files 必须写 extra_css / extra_javascript 里那条
  # **一模一样**的路径（不能写 glob）。插件在 on_pre_build 时靠精确匹配把引用
  # 改写成 xxx.min.css，写 glob 的话改名会发生、引用不会改，页面就 404 了。
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      css_files:
        - stylesheets/extra.css
      js_files:
        - javascripts/mathjax.js

  # 每页显示创建 / 最后更新日期（读 git 记录，需要仓库有提交历史）
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: zh_CN
      fallback_to_build_date: true
      enable_git_follow: false

  # 图片点击放大
  - glightbox


# -----------------------------------------------------------------------------
# Markdown 扩展
# -----------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      title: 本页目录

  # 注意：这里千万不要写成 `pymdownx.betterem: {smart_enable: all}`。
  # Material 官方文档推荐那样写，但它对中文是灾难：
  # smart_strong 用 \w 判断词边界，而 Python 的 \w 是匹配汉字的。
  # 中文没有空格，`是**粗体**：` 会被判成「词中间」而拒绝加粗，
  # 于是全站中文加粗静默失效，页面上直接显示字面的 **。
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.inlinehilite

  # 数学公式。generic 模式覆盖 $...$ 和 $$...$$，
  # 实际渲染交给下面的 MathJax。
  - pymdownx.arithmatex:
      generic: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true


# -----------------------------------------------------------------------------
# 样式
# -----------------------------------------------------------------------------
extra_css:
  # 霞鹜文楷 Web Font（自托管 woff2 子集，按 unicode-range 按需加载）
  - assets/fonts/lxgw-wenkai/lxgwwenkai-regular.css
  - assets/fonts/lxgw-wenkai/lxgwwenkai-bold.css
  - assets/fonts/lxgw-wenkai/lxgwwenkaimono-regular.css
  # 站点自定义样式（含字体变量、PDF 阅读器、Typst 效果图）
  - stylesheets/extra.css

# 数学公式：本地放一份 MathJax 配置，引擎本体走 CDN。
# 全站唯一的外部依赖，介意的话把下面两行删掉，行内公式会退化成原始的 $...$。
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js


# -----------------------------------------------------------------------------
# 其它
# -----------------------------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Superckkk
      name: GitHub
    # 想放邮箱就把下面两行取消注释
    # - icon: fontawesome/solid/envelope
    #   link: mailto:you@example.com
    #   name: 邮箱
