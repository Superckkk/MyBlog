# 推送到 main 就自动构建并发布到 GitHub Pages
#
# ⚠️ 首次使用前必须先在仓库里开一次 Pages，否则工作流会卡在 "Setup Pages" 这一步：
#     Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#
# 这一步没法自动化：GITHUB_TOKEN 没有创建 Pages 站点的权限，
# 实测会报 "Resource not accessible by integration"。
# 开一次之后就不用再管了，之后每次 push 都会自动发布。
#
# 自定义域名 turingckkk.com 写在 docs/CNAME 里，构建后会落到 site/CNAME。
# 如果 Pages 设置里的 Custom domain 没有自动带出来，手动填一次，
# 等证书签发完再勾上 Enforce HTTPS。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 Actions 页面手动触发

# GITHUB_TOKEN 需要这三个权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，排队而不是取消，避免发到一半被打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 必须拉全量历史：git-revision-date-localized 要靠 git log
          # 给每页算创建/更新日期。默认的浅克隆会让日期全变成构建时间。
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 有警告就直接失败，不会把坏页面发上去
      - name: Build site
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
